# Fly.io deployment manifest for the InvestPro backend.
# Deploy with: fly launch --copy-config --name investpro-api
# Or, after editing: fly deploy

app = "investpro-api"
primary_region = "ord"  # Chicago — closest big region to Indiana
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  CREDENTIALS_DB_PATH = "/data/credentials.sqlite"
  REDIS_URL = "redis://localhost:6379"
  # CORS_ALLOWED_ORIGINS and CREDENTIALS_MASTER_KEY are set as secrets
  # via: fly secrets set CREDENTIALS_MASTER_KEY=... CORS_ALLOWED_ORIGINS=...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

# Persistent volume for the encrypted SQLite credential store.
# Create once with: fly volumes create investpro_data --region ord --size 1
[mounts]
  source = "investpro_data"
  destination = "/data"
