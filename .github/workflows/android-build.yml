name: Android APK Build & Release

# Builds the signed release APK and publishes it three ways:
#   1. Attached as a GitHub Release asset (always)
#   2. Uploaded to Cloudflare R2 as InvestPro-latest.apk (when secrets present)
#   3. Available as a workflow artifact (always, for debugging)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   - base64-encoded release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias inside the keystore
#   ANDROID_KEY_PASSWORD      - key password
#
# Optional secrets (for R2 upload):
#   CF_ACCOUNT_ID
#   CF_R2_ACCESS_KEY_ID
#   CF_R2_SECRET_ACCESS_KEY
#   CF_R2_BUCKET              - defaults to "investpro-apk"

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave blank for auto-numbered nightly.'
        required: false
        default: ''

permissions:
  contents: write  # required to attach to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle*', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $RUNNER_TEMP/signing
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/signing/release.jks
            echo "path=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice ::Using release signing keystore from secrets."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning ::No keystore secret provided — APK will be debug-signed and unsuitable for production."
          fi

      - name: Build release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        working-directory: android-app
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error ::No APK produced."
            exit 1
          fi
          echo "apk_path=android-app/$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $APK_PATH)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="nightly-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice ::Release tag is $TAG"

      - name: Rename APK for distribution
        id: rename
        run: |
          DIST_DIR="$RUNNER_TEMP/dist"
          mkdir -p "$DIST_DIR"
          cp "${{ steps.locate.outputs.apk_path }}" "$DIST_DIR/InvestPro-${{ steps.tag.outputs.tag }}.apk"
          cp "${{ steps.locate.outputs.apk_path }}" "$DIST_DIR/InvestPro-latest.apk"
          echo "tagged=$DIST_DIR/InvestPro-${{ steps.tag.outputs.tag }}.apk" >> "$GITHUB_OUTPUT"
          echo "latest=$DIST_DIR/InvestPro-latest.apk" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestPro-APK-${{ steps.tag.outputs.tag }}
          path: ${{ steps.rename.outputs.tagged }}
          retention-days: 30

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: InvestPro ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.rename.outputs.tagged }}
            ${{ steps.rename.outputs.latest }}

      - name: Upload to Cloudflare R2
        if: ${{ secrets.CF_R2_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BUCKET: ${{ secrets.CF_R2_BUCKET || 'investpro-apk' }}
        run: |
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${{ steps.rename.outputs.tagged }}" \
            "s3://${BUCKET}/InvestPro-${{ steps.tag.outputs.tag }}.apk" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive"
          aws s3 cp "${{ steps.rename.outputs.latest }}" \
            "s3://${BUCKET}/InvestPro-latest.apk" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive"
          echo "::notice ::Uploaded to https://apk.nhsindy.com/InvestPro-latest.apk"
